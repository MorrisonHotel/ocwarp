# Базовый ocserv.conf. Копируется в volume только при первом запуске,
# дальше правится там: /etc/ocserv/ocserv.conf.
# Порт, сеть, DNS, сертификаты и устройство задаёт окружение (OC_*), здесь их нет.
auth = "plain[passwd=/etc/ocserv/ocpasswd]"
isolate-workers = true
max-clients = 50
max-same-clients = 4
rate-limit-ms = 200
server-stats-reset-time = 604800
keepalive = 30
dpd = 30
mobile-dpd = 300
switch-to-tcp-timeout = 25
try-mtu-discovery = false
tls-priorities = "NORMAL:%SERVER_PRECEDENCE:%COMPAT:-VERS-SSL3.0:-VERS-TLS1.0:-VERS-TLS1.1"
auth-timeout = 240
ban-time = 300
max-ban-score = 80
ban-reset-time = 1200
cookie-timeout = 600
deny-roaming = false
rekey-time = 172800
rekey-method = ssl
use-occtl = true
pid-file = /var/run/ocserv.pid
socket-file = /var/run/ocserv.socket
log-level = 1
predictable-ips = true
tunnel-all-dns = true
ping-leases = false
cisco-client-compat = true
dtls-legacy = true
client-bypass-protocol = false
